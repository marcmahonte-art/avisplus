<svg viewBox="0 0 680 610" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Parcours de création d'une page digitale Avis+</title>
  <desc>Cinq étapes, de la connexion à l'enregistrement, avec la mention que l'enregistrement n'est pas encore persisté en V1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="140" y="40" width="400" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="164" y="61" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">1 · Se connecter au back-office</text>
    <text x="164" y="79" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" dominant-baseline="central">/admin/login — identifiants de démonstration</text>
  </g>

  <path d="M340 100 L340 150" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="140" y="156" width="400" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="164" y="177" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">2 · Pages digitales</text>
    <text x="164" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" dominant-baseline="central">Bouton « Nouvelle page digitale », en haut de la liste</text>
  </g>

  <path d="M340 216 L340 266" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="140" y="272" width="400" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="164" y="293" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">3 · Identité et classement</text>
    <text x="164" y="311" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" dominant-baseline="central">Nom, slug, catégorie, sous-catégorie, template</text>
  </g>

  <path d="M340 332 L340 382" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="140" y="388" width="400" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="164" y="409" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">4 · Coordonnées et avis</text>
    <text x="164" y="427" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" dominant-baseline="central">Contact, adresse, lien Google Avis, horaires</text>
  </g>

  <path d="M340 448 L340 498" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="140" y="504" width="400" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="164" y="525" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#633806" dominant-baseline="central">5 · Enregistrer</text>
    <text x="164" y="543" font-family="system-ui, sans-serif" font-size="12" fill="#854F0B" dominant-baseline="central">Statut « Brouillon » par défaut</text>
  </g>

  <text x="140" y="590" font-family="system-ui, sans-serif" font-size="12" fill="#854F0B" dominant-baseline="central">En V1, cette étape valide le formulaire mais n'écrit rien en base : aucune page n'est réellement créée.</text>
</svg>
